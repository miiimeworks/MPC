; MIIIME Process Closer Configuration
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
; 실행 정보
; Execution Information
; ----------------------------------------------------------------------------------------

AppName=MIIIME Process Closer

[Settings]
; 통합 설정 (권한 및 옵션)
; Integrated Settings (Permissions and Options)
; ----------------------------------------------------------------------------------------

; 관리자 권한으로 실행 (true/false) / Run as administrator (true/false)
; 시스템 프로세스(CursorFX 등)를 끄려면 true 권장
; true is recommended to turn off system processes (CursorFX, etc.).
RunAsAdmin=true

; 완료 메시지 표시 여부 (1: 표시, 0: 숨김)
; Whether to display completion message (1: Show, 0: Hide)
ShowFinishMsg=1

; 완료 메시지 내용
; Completion message content
FinishText=All specified processes have been cleaned.

; 종료 후 남은 reg.exe(reg delete HKU\...) 정리 (1: 사용, 0: 안 함)
; Clean up leftover reg.exe (reg delete HKU\...) after closing (1: On, 0: Off)
KillStuckReg=1

; reg.exe가 스스로 끝나길 기다리는 최대 시간(초), 넘으면 강제 종료
; Max seconds to wait for reg.exe to finish before force-killing it
RegWaitSec=5

[FolderIcon]
; 폴더 아이콘 - 패밀리 룩
; Folder Icon - Family Look
; ----------------------------------------------------------------------------------------

Icon01=Ext\Res\Folder.ico

[Processes]
; 종료할 프로세스 목록
; List of processes to terminate
; ----------------------------------------------------------------------------------------
; 종료할 프로세스 이름(Image Name)을 한 줄에 하나씩 입력.
; 주석(; 또는 :) 처리된 줄은 무시됨.
; Enter the process names (Image Names) to terminate, one per line.
; Commented-out lines (; or :) are ignored.

